<rect x="666.4" y="300" width="23.0" height="18" fill="url(#hatch)" stroke="#e0a84a" stroke-width="1"/>
<text x="706" y="315" font-size="12.5" font-weight="normal" fill="#e6edf3" text-anchor="start">94.63%  next: 99.86%</text>
<rect x="28" y="334" width="12" height="10" fill="url(#hatch)" stroke="#e0a84a" stroke-width="1"/>
<text x="46" y="343" font-size="11.5" font-weight="normal" fill="#8b9bb0" text-anchor="start">figure from the next compiler round, still being tested (not a result yet)</text>
<text x="28" y="378" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">The whole game, every scene</text>
<rect x="28" y="392" width="662" height="22" rx="4" fill="url(#hatch2)" stroke="#5b6b80" stroke-width="1"/>
<text x="706" y="408" font-size="13" font-weight="normal" fill="#8b9bb0" text-anchor="start">not measured yet</text>
<text x="28" y="432" font-size="11.5" font-weight="normal" fill="#8b9bb0" text-anchor="start">These figures cover the replays we have (intro, Leene Square, first battle, world map, menu). Whole-game coverage needs recordings of full playthroughs.</text>
<text x="28" y="472" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">Steps to an interpreter-free recorded playthrough</text>
<circle cx="35" cy="494" r="6" fill="#3fb6a8"/>
<text x="52" y="498" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start">alpha.1: first public build</text>
