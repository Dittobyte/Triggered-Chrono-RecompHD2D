<text x="52" y="576" font-size="13" font-weight="normal" fill="#8b9bb0" text-anchor="start">Record the whole game in chapters</text>
<text x="872" y="576" font-size="12" font-weight="normal" fill="#5b6b80" text-anchor="end">to do</text>
<circle cx="35" cy="598" r="6" fill="none" stroke="#5b6b80" stroke-width="2"/>
