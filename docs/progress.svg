<text x="706" y="134" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start">87.9%  (1990 of 2263)</text>
<text x="28" y="174" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">Instructions that run as native code, per recorded replay</text>
