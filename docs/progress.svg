<svg xmlns="http://www.w3.org/2000/svg" width="900" height="732" viewBox="0 0 900 732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl"><title id="ttl">Triggered Chrono recompile progress</title><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1d2b3c"/><rect width="4" height="8" fill="#e0a84a" fill-opacity="0.55"/></pattern><pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0e1621"/><rect width="4" height="8" fill="#5b6b80" fill-opacity="0.35"/></pattern></defs><rect x="0.5" y="0.5" width="899" height="731" rx="10" fill="#0e1621" stroke="#243447"/>
<text x="28" y="44" font-size="22" font-weight="bold" fill="#e6edf3" text-anchor="start">Triggered Chrono: road to a fully native Chrono Trigger</text>
<text x="28" y="66" font-size="12.5" font-weight="normal" fill="#8b9bb0" text-anchor="start">Measured 2026-11-17 on commit 9ea2211 (v0.1.0-alpha.2). Native = compiled C; the rest runs in the built-in interpreter.</text>
<text x="28" y="104" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">Known functions compiled to native C</text>
