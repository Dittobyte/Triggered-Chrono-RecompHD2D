<circle cx="35" cy="546" r="6" fill="#e0a84a"/>
<text x="52" y="550" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start">alpha.3: next compiler round (99%+ on the replays)</text>
<text x="872" y="550" font-size="12" font-weight="normal" fill="#e0a84a" text-anchor="end">in testing</text>
