<text x="872" y="602" font-size="12" font-weight="normal" fill="#5b6b80" text-anchor="end">to do</text>
<circle cx="35" cy="624" r="6" fill="none" stroke="#5b6b80" stroke-width="2"/>
<text x="52" y="628" font-size="13" font-weight="normal" fill="#8b9bb0" text-anchor="start">Trap build: list every entry into the interpreter</text>
<text x="872" y="628" font-size="12" font-weight="normal" fill="#5b6b80" text-anchor="end">to do</text>
<circle cx="35" cy="650" r="6" fill="none" stroke="#5b6b80" stroke-width="2"/>
<text x="52" y="654" font-size="13" font-weight="normal" fill="#8b9bb0" text-anchor="start">Close the list (RAM code, jump tables, stubs)</text>
<text x="872" y="654" font-size="12" font-weight="normal" fill="#5b6b80" text-anchor="end">to do</text>
<circle cx="35" cy="676" r="6" fill="none" stroke="#5b6b80" stroke-width="2"/>
<text x="52" y="680" font-size="13" font-weight="normal" fill="#8b9bb0" text-anchor="start">Zero interpreted instructions across the recorded game</text>
<text x="872" y="680" font-size="12" font-weight="normal" fill="#5b6b80" text-anchor="end">to do</text>
<text x="28" y="706" font-size="11.5" font-weight="normal" fill="#8b9bb0" text-anchor="start">The interpreter stays in the program as the test referee and last-resort fallback; the goal is that play never reaches it.</text>
